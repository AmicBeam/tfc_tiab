modLoader="javafml"
loaderVersion="[4,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_display_name}"
credits="Integration mod for TerraFirmaCraft, Firmalife, and Time In A Bottle"
authors="${mod_authors}"
description='''
${mod_description}
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="[${minecraft_version}]"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="tiab"
type="required"
versionRange="[${tiab_version},)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="tfc"
type="required"
versionRange="[${tfc_version},)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="firmalife"
type="optional"
versionRange="[${firmalife_version},)"
ordering="AFTER"
side="BOTH"

[[mixins]]
config="tfc_tiab.mixins.json"
