plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

tasks.named('jar', Jar).configure {
    archiveVersion = "${mod_version}+${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    exclusiveContent {
        forRepository { maven { url = 'https://www.cursemaven.com' } }
        filter { includeGroup 'curse.maven' }
    }
    exclusiveContent {
        forRepository { maven { url = 'https://maven.blamejared.com' } }
        filter { includeGroup 'vazkii.patchouli' }
    }
}

neoForge {
    version = project.neo_version

    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    implementation "curse.maven:terrafirmacraft-302973:${tfc_file_id}"
    implementation "curse.maven:time-in-a-bottle-895919:${tiab_file_id}"
    compileOnly "curse.maven:firmalife-453394:${firmalife_file_id}"
    runtimeOnly "vazkii.patchouli:Patchouli:${patchouli_version}"
    if (providers.gradleProperty('withFirmalife').isPresent()) {
        runtimeOnly "curse.maven:firmalife-453394:${firmalife_file_id}"
    }
}

tasks.named('processResources', ProcessResources).configure {
    def metadata = [
        minecraft_version     : minecraft_version,
        neo_version           : neo_version,
        tfc_version           : tfc_version,
        tiab_version          : tiab_version,
        firmalife_version     : firmalife_version,
        mod_id                : mod_id,
        mod_display_name      : mod_display_name,
        mod_license           : mod_license,
        mod_version           : mod_version,
        mod_authors           : mod_authors,
        mod_description       : mod_description
    ]
    inputs.properties metadata
    filesMatching('META-INF/neoforge.mods.toml') { expand metadata }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
